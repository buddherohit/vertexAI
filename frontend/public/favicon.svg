<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#141c48"/>
      <stop offset="60%" stop-color="#070a1e"/>
      <stop offset="100%" stop-color="#02030a"/>
    </radialGradient>
    <linearGradient id="bgBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3c8d" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#182052" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Left Arm Gradient -->
    <linearGradient id="leftArmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="30%" stop-color="#0ea5e9"/>
      <stop offset="70%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Right Ribbon Main Gradient -->
    <linearGradient id="rightRibbonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="40%" stop-color="#8b5cf6"/>
      <stop offset="80%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Right Ribbon Fold/Top Wave Gradient -->
    <linearGradient id="ribbonFoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Inner Ribbon Layer -->
    <linearGradient id="ribbonInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Left Bracket Gradient -->
    <linearGradient id="leftBracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Right Bracket Gradient -->
    <linearGradient id="rightBracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Sparkle Gradient -->
    <radialGradient id="sparkleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ede9fe"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle / App Icon Rounded Card -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGlow)" stroke="url(#bgBorder)" stroke-width="4"/>

  <!-- Background Ambient Glow Behind V -->
  <ellipse cx="256" cy="245" rx="140" ry="140" fill="#3b82f6" opacity="0.12" filter="url(#glow)"/>
  <ellipse cx="280" cy="230" rx="120" ry="120" fill="#8b5cf6" opacity="0.15" filter="url(#glow)"/>

  <!-- Left Code Bracket < -->
  <path d="M 132 205 L 86 248 C 81 253 81 259 86 264 L 132 307" 
        fill="none" 
        stroke="url(#leftBracketGrad)" 
        stroke-width="22" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="drop-shadow(0 0 10px rgba(56,189,248,0.4))" />

  <!-- Right Code Bracket > -->
  <path d="M 380 205 L 426 248 C 431 253 431 259 426 264 L 380 307" 
        fill="none" 
        stroke="url(#rightBracketGrad)" 
        stroke-width="22" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="drop-shadow(0 0 10px rgba(168,85,247,0.4))" />

  <!-- Central 4-Point AI Sparkle Star -->
  <g transform="translate(268, 142)">
    <path d="M 0 -28 Q 0 0 28 0 Q 0 0 0 28 Q 0 0 -28 0 Q 0 0 0 -28 Z" 
          fill="url(#sparkleGrad)"
          filter="drop-shadow(0 0 12px rgba(237,233,254,0.8))"/>
  </g>

  <!-- 3D Ribbon "V" Symbol -->
  <!-- 1. Left Arm of V -->
  <path d="M 116 102 
           C 112 102, 108 106, 110 111 
           L 224 388 
           C 230 402, 246 411, 261 406 
           C 272 402, 281 392, 285 382 
           L 186 106 
           C 184 103, 180 102, 176 102 
           Z" 
        fill="url(#leftArmGrad)"
        filter="drop-shadow(0 4px 20px rgba(14,165,233,0.3))"/>

  <!-- 2. Inner Fold Translucent Layer -->
  <path d="M 235 340 
           L 358 152 
           C 342 165, 320 200, 290 250 
           L 242 330 
           Z" 
        fill="url(#ribbonInnerGrad)" 
        opacity="0.85"/>

  <!-- 3. Right Sweeping Ribbon of V -->
  <path d="M 234 402 
           C 248 408, 268 402, 282 380 
           L 380 162 
           C 395 128, 412 102, 368 102 
           C 345 102, 330 114, 314 135 
           L 228 322 
           C 214 352, 218 385, 234 402 
           Z" 
        fill="url(#rightRibbonGrad)"
        filter="drop-shadow(0 6px 24px rgba(139,92,246,0.4))"/>

  <!-- 4. Top Ribbon Crest / Twist Highlight -->
  <path d="M 334 116 
           C 348 104, 364 98, 388 100 
           C 414 102, 412 124, 396 148 
           C 378 174, 350 206, 320 254 
           C 334 214, 348 178, 358 152 
           C 366 130, 362 120, 348 120 
           C 342 120, 338 122, 334 126 
           Z" 
        fill="url(#ribbonFoldGrad)"
        opacity="0.95"
        filter="drop-shadow(0 2px 8px rgba(216,180,254,0.5))"/>

</svg>